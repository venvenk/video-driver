name: Load Parameters
description: Load parameters for the build job

outputs:
  build_matrix:
    description: Build matrix
    value: ${{ steps.set-matrix.outputs.build_matrix }}

runs:
  using: "composite"
  steps:
    - name: Set build matrix
      id: set-matrix
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const machineFile = path.join(
            process.env.GITHUB_WORKSPACE, 'ci', 'MACHINES.json'
          );

          if (!fs.existsSync(machineFile)) {
            core.setFailed(`MACHINES.json not found at ${machineFile}`);
            return;
          }

          let config;
          try {
            config = JSON.parse(fs.readFileSync(machineFile, 'utf-8'));
          } catch (err) {
            core.setFailed(`Failed to parse MACHINES.json: ${err.message}`);
            return;
          }

          // Emit all fields so build + test jobs can consume what they need
          const buildMatrix = Object.values(config).map(obj => ({ ...obj }));
          core.setOutput('build_matrix', JSON.stringify(buildMatrix));
          console.log('Build Matrix:', JSON.stringify(buildMatrix, null, 2));