name: LAVA Job Render
description: >
  Writes synthetic cloudData.json + metadata.json, then renders a LAVA
  job definition using lava_Job_definition_generator.py with
  BOOT_METHOD=flasher and --video_pre-merge tests.

inputs:
  docker_image:
    description: Docker image to use for rendering
    required: true
  machine:
    description: Target machine name (e.g. qcs9100-ride-sx)
    required: true
  lavaname:
    description: LAVA device-type name
    required: true
  presigned_urls_file:
    description: Absolute path to presigned_urls.json from the build job
    required: true

runs:
  using: "composite"
  steps:

    - name: Extract presigned URL for this machine
      id: get_url
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        PRESIGNED_FILE: ${{ inputs.presigned_urls_file }}
      run: |
        set -euo pipefail

        tarball_key="${MACHINE}_qcomflash_payload.tar"

        if [ ! -f "$PRESIGNED_FILE" ]; then
          echo "❌ presigned_urls.json not found at: $PRESIGNED_FILE"
          exit 1
        fi

        echo "=== presigned_urls.json keys ==="
        jq -r 'keys[]' "$PRESIGNED_FILE"

        url="$(jq -r --arg key "$tarball_key" '.[$key] // empty' "$PRESIGNED_FILE")"

        if [ -z "$url" ]; then
          echo "❌ No presigned URL found for key: $tarball_key"
          exit 1
        fi

        echo "✅ Resolved presigned URL for: $tarball_key"
        echo "artifact_url=$url" >> "$GITHUB_OUTPUT"

    - name: Write synthetic cloudData.json and metadata.json
      id: write_json
      shell: bash
      env:
        MACHINE:      ${{ inputs.machine }}
        LAVA_NAME:    ${{ inputs.lavaname }}
        ARTIFACT_URL: ${{ steps.get_url.outputs.artifact_url }}
        WORKSPACE:    ${{ github.workspace }}
      run: |
        set -euo pipefail

        JOB_RENDER_DIR="$(dirname "$WORKSPACE")/job_render"

        if [ ! -d "$JOB_RENDER_DIR" ]; then
          echo "❌ job_render directory not found at: $JOB_RENDER_DIR"
          ls -la "$(dirname "$WORKSPACE")"
          exit 1
        fi

        DATA_DIR="$JOB_RENDER_DIR/data"
        mkdir -p "$DATA_DIR"

        # Map machine → DTB filename (no path, no extension)
        # Passed as TARGET_DTB env var into the generator container
        case "$MACHINE" in
          qcs9100-ride-sx)  DTB_NAME="qcs9100-ride-r3" ;;
          qcs8300-ride-sx)  DTB_NAME="qcs8300-ride"    ;;
          rb3gen2-core-kit) DTB_NAME="qcs6490-rb3gen2" ;;
          qcs615-ride)      DTB_NAME="qcs615-ride"      ;;
          sm8750-mtp)       DTB_NAME="sm8750-mtp"       ;;
          kaanapali-mtp)    DTB_NAME="kaanapali-mtp"    ;;
          *)                DTB_NAME="$MACHINE"         ;;
        esac

        echo "dtb_name=$DTB_NAME" >> "$GITHUB_OUTPUT"
        echo "job_render_dir=$JOB_RENDER_DIR" >> "$GITHUB_OUTPUT"

        echo "📝 Writing cloudData.json"
        cat > "$DATA_DIR/cloudData.json" << EOF
        {
          "id": "ci-${MACHINE}",
          "kind": "kbuild",
          "name": "ci-build-${MACHINE}",
          "path": ["checkout", "ci-build-${MACHINE}"],
          "group": "ci-build-${MACHINE}",
          "parent": "",
          "state": "done",
          "result": "pass",
          "artifacts": {
            "metadata":    "",
            "kernel":      "",
            "vmlinux":     "",
            "modules":     "",
            "ramdisk":     "",
            "firmware":    "",
            "dtb":         "",
            "flash_image": "${ARTIFACT_URL}"
          },
          "data": {
            "kernel_revision": {
              "tree": "qcom-next",
              "url": "",
              "branch": "main",
              "commit": "",
              "describe": "",
              "version": {
                "version": 0, "patchlevel": 0, "sublevel": null,
                "extra": "", "name": null
              },
              "patchset": null,
              "commit_tags": [],
              "commit_message": "",
              "tip_of_branch": true
            },
            "arch":        "arm64",
            "defconfig":   "defconfig",
            "compiler":    "gcc-12",
            "error_code":  null,
            "error_msg":   null,
            "fragments":   [],
            "config_full": "defconfig",
            "platform":    "${LAVA_NAME}",
            "runtime":     "lava",
            "job_id":      "ci-${MACHINE}",
            "job_context": "github-actions",
            "kernel_type": "image",
            "regression":  null
          },
          "debug": {},
          "jobfilter": null,
          "platform_filter": [],
          "owner": "production",
          "submitter": "service:pipeline"
        }
        EOF
        echo "✅ cloudData.json written"

        echo "📝 Writing metadata.json (DTB: dtbs/qcom/${DTB_NAME}.dtb)"
        cat > "$DATA_DIR/metadata.json" << EOF
        {
          "build": {
            "arch": "arm64",
            "compiler": "gcc-12",
            "defconfig": "defconfig",
            "fragments": [],
            "config_full": "defconfig",
            "result": "pass"
          },
          "artifacts": {
            "dtbs/qcom/${DTB_NAME}.dtb": ""
          }
        }
        EOF
        echo "✅ metadata.json written"

    - name: Render LAVA job definition
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.docker_image }}
        MACHINE:      ${{ inputs.machine }}
        LAVA_NAME:    ${{ inputs.lavaname }}
        WORKSPACE:    ${{ github.workspace }}
        # TARGET_DTB is the key the generator uses to look up the DTB
        # in metadata.json — must match exactly (no path, no extension)
        TARGET_DTB:   ${{ steps.write_json.outputs.dtb_name }}
      run: |
        set -euo pipefail

        JOB_RENDER_DIR="${{ steps.write_json.outputs.job_render_dir }}"
        RENDERS_DIR="$JOB_RENDER_DIR/renders"
        mkdir -p "$RENDERS_DIR"

        echo "🔧 Rendering LAVA job for machine=$MACHINE lavaname=$LAVA_NAME dtb=$TARGET_DTB"

        docker run -i --rm \
          --workdir="$JOB_RENDER_DIR" \
          -v "$(dirname "$JOB_RENDER_DIR"):$(dirname "$JOB_RENDER_DIR")" \
          -e MACHINE="$MACHINE" \
          -e TARGET="$MACHINE" \
          -e LAVA_NAME="$LAVA_NAME" \
          -e TARGET_DTB="$TARGET_DTB" \
          -e BOOT_METHOD="flasher" \
          "$DOCKER_IMAGE" \
          bash -c '
            set -euo pipefail
            export BOOT_METHOD=flasher
            python3 lava_Job_definition_generator.py \
              --localjson ./data/cloudData.json \
              --meta-qcom \
              --video_pre-merge
          '

        echo "✅ LAVA job definition rendered"
        echo "=== Rendered YAML ==="
        cat "$RENDERS_DIR/lava_job_definition.yaml"