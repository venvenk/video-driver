name: LAVA Job Render
description: >
  Writes synthetic cloudData.json + metadata.json, renders a LAVA job
  definition with BOOT_METHOD=flasher and --video_pre-merge tests,
  then patches job timeout to 240 min and download timeout to 120 min
  with 3 retries inside Docker.

inputs:
  docker_image:
    description: Docker image to use for rendering
    required: true
  machine:
    description: Target machine name (e.g. qcs9100-ride-sx)
    required: true
  lavaname:
    description: LAVA device-type name
    required: true
  presigned_urls_file:
    description: Absolute path to presigned_urls.json from the build job
    required: true

runs:
  using: "composite"
  steps:

    - name: Extract presigned URL for this machine
      id: get_url
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        PRESIGNED_FILE: ${{ inputs.presigned_urls_file }}
      run: |
        set -euo pipefail

        tarball_key="${MACHINE}_qcomflash_payload.tar"

        if [ ! -f "$PRESIGNED_FILE" ]; then
          echo "❌ presigned_urls.json not found at: $PRESIGNED_FILE"
          exit 1
        fi

        echo "=== presigned_urls.json keys ==="
        jq -r 'keys[]' "$PRESIGNED_FILE"

        url="$(jq -r --arg key "$tarball_key" '.[$key] // empty' "$PRESIGNED_FILE")"

        if [ -z "$url" ]; then
          echo "❌ No presigned URL found for key: $tarball_key"
          exit 1
        fi

        echo "✅ Resolved presigned URL for: $tarball_key"
        echo "artifact_url=$url" >> "$GITHUB_OUTPUT"

    - name: Write synthetic cloudData.json and metadata.json
      id: write_json
      shell: bash
      env:
        MACHINE:      ${{ inputs.machine }}
        LAVA_NAME:    ${{ inputs.lavaname }}
        ARTIFACT_URL: ${{ steps.get_url.outputs.artifact_url }}
        WORKSPACE:    ${{ github.workspace }}
      run: |
        set -euo pipefail

        JOB_RENDER_DIR="$(dirname "$WORKSPACE")/job_render"

        if [ ! -d "$JOB_RENDER_DIR" ]; then
          echo "❌ job_render directory not found at: $JOB_RENDER_DIR"
          ls -la "$(dirname "$WORKSPACE")"
          exit 1
        fi

        DATA_DIR="$JOB_RENDER_DIR/data"
        mkdir -p "$DATA_DIR"

        case "$MACHINE" in
          qcs9100-ride-sx)  DTB_NAME="qcs9100-ride-r3" ;;
          qcs8300-ride-sx)  DTB_NAME="qcs8300-ride"    ;;
          rb3gen2-core-kit) DTB_NAME="qcs6490-rb3gen2" ;;
          qcs615-ride)      DTB_NAME="qcs615-ride"      ;;
          sm8750-mtp)       DTB_NAME="sm8750-mtp"       ;;
          kaanapali-mtp)    DTB_NAME="kaanapali-mtp"    ;;
          *)                DTB_NAME="$MACHINE"         ;;
        esac

        echo "dtb_name=$DTB_NAME"             >> "$GITHUB_OUTPUT"
        echo "job_render_dir=$JOB_RENDER_DIR" >> "$GITHUB_OUTPUT"

        echo "📝 Writing cloudData.json via jq (machine=$MACHINE lavaname=$LAVA_NAME dtb=$DTB_NAME)"

        jq -n \
          --arg machine   "$MACHINE" \
          --arg lavaname  "$LAVA_NAME" \
          --arg url       "$ARTIFACT_URL" \
          '{
            "id":     ("ci-" + $machine),
            "kind":   "kbuild",
            "name":   ("ci-build-" + $machine),
            "path":   ["checkout", ("ci-build-" + $machine)],
            "group":  ("ci-build-" + $machine),
            "parent": "",
            "state":  "done",
            "result": "pass",
            "artifacts": {
              "metadata":   "",
              "kernel":     "",
              "vmlinux":    "",
              "modules":    "",
              "ramdisk":    "",
              "firmware":   "",
              "dtb":        "",
              "flash_image": $url
            },
            "data": {
              "kernel_revision": {
                "tree":    "qcom-next",
                "url":     "",
                "branch":  "main",
                "commit":  "",
                "describe": "",
                "version": {
                  "version": 0, "patchlevel": 0, "sublevel": null,
                  "extra": "", "name": null
                },
                "patchset":       null,
                "commit_tags":    [],
                "commit_message": "",
                "tip_of_branch":  true
              },
              "arch":        "arm64",
              "defconfig":   "defconfig",
              "compiler":    "gcc-12",
              "error_code":  null,
              "error_msg":   null,
              "fragments":   [],
              "config_full": "defconfig",
              "platform":    $lavaname,
              "runtime":     "lava",
              "job_id":      ("ci-" + $machine),
              "job_context": "github-actions",
              "kernel_type": "image",
              "regression":  null
            },
            "debug": {},
            "jobfilter":      null,
            "platform_filter": [],
            "owner":     "production",
            "submitter": "service:pipeline"
          }' > "$DATA_DIR/cloudData.json"

        echo "✅ cloudData.json written"
        cat "$DATA_DIR/cloudData.json"

        echo "📝 Writing metadata.json (DTB key: dtbs/qcom/${DTB_NAME}.dtb)"

        jq -n \
          --arg dtb "dtbs/qcom/${DTB_NAME}.dtb" \
          '{
            "build": {
              "arch":        "arm64",
              "compiler":    "gcc-12",
              "defconfig":   "defconfig",
              "fragments":   [],
              "config_full": "defconfig",
              "result":      "pass"
            },
            "artifacts": {
              ($dtb): ""
            }
          }' > "$DATA_DIR/metadata.json"

        echo "✅ metadata.json written"
        cat "$DATA_DIR/metadata.json"

    - name: Render LAVA job definition and patch timeouts inside Docker
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.docker_image }}
        MACHINE:      ${{ inputs.machine }}
        LAVA_NAME:    ${{ inputs.lavaname }}
        TARGET_DTB:   ${{ steps.write_json.outputs.dtb_name }}
        WORKSPACE:    ${{ github.workspace }}
      run: |
        set -euo pipefail

        JOB_RENDER_DIR="${{ steps.write_json.outputs.job_render_dir }}"
        RENDERS_DIR="$JOB_RENDER_DIR/renders"
        mkdir -p "$RENDERS_DIR"

        echo "🔧 Rendering LAVA job: machine=$MACHINE lavaname=$LAVA_NAME dtb=$TARGET_DTB"

        docker run -i --rm \
          --workdir="$JOB_RENDER_DIR" \
          -v "$(dirname "$JOB_RENDER_DIR"):$(dirname "$JOB_RENDER_DIR")" \
          -e MACHINE="$MACHINE" \
          -e TARGET="$MACHINE" \
          -e LAVA_NAME="$LAVA_NAME" \
          -e TARGET_DTB="$TARGET_DTB" \
          -e BOOT_METHOD="flasher" \
          "$DOCKER_IMAGE" \
          bash -c '
            set -euo pipefail

            export BOOT_METHOD=flasher
            python3 lava_Job_definition_generator.py \
              --localjson ./data/cloudData.json \
              --meta-qcom \
              --video_pre-merge

            echo "✅ Render complete — patching timeouts..."

            YAML="./renders/lava_job_definition.yaml"

            # Patch job-level timeout to 240 min so it exceeds all action timeouts
            python3 - <<EOF
import yaml, sys

with open("$YAML", "r") as f:
    job = yaml.safe_load(f)

# 1. Job-level timeout — must be > all action timeouts
job.setdefault("timeouts", {})
job["timeouts"]["job"] = {"minutes": 240}

# 2. Download action timeout + retries inside the actions list
for action in job.get("actions", []):
    if "deploy" in action:
        deploy = action["deploy"]
        if deploy.get("to") == "downloads":
            deploy["timeout"] = {"minutes": 120}
            deploy["retries"]  = 3

with open("$YAML", "w") as f:
    yaml.dump(job, f, default_flow_style=False, allow_unicode=True)

print("✅ Timeouts patched: job=240min, download=120min, retries=3")
EOF
          '

        echo "✅ LAVA job definition rendered and patched"
        echo "=== Rendered YAML ==="
        cat "$RENDERS_DIR/lava_job_definition.yaml"