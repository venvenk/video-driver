name: _build

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true

jobs:
  build:
    timeout-minutes: 120
    runs-on:
      group: GHA-video-Prd-SelfHosted-RG
      labels: [self-hosted, video-prd-u2204-x64-large-od-ephem]
    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Sync video-driver codebase
        uses: qualcomm-linux/video-driver/.github/actions/sync@meta-qcom_full-build-copy
        with:
          event_name: ${{ github.event_name }}
          pr_ref: ${{ github.event.pull_request.head.ref || '' }}
          pr_repo: ${{ github.event.pull_request.head.repo.full_name || '' }}
          base_ref: ${{ github.ref_name }}

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Retag Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker tag \
            "artifacts.codelinaro.org/clo-420-qli-registry/${{ inputs.docker_image }}" \
            "${{ inputs.docker_image }}" || true
          docker images | grep kmake-image || true

      - name: Download meta artifact from S3
        shell: bash
        env:
          WORKSPACE:      ${{ github.workspace }}
          MACHINE:        ${{ matrix.build_matrix.machine }}
          META_S3_KEY:    ${{ matrix.build_matrix.meta_s3_key }}
          META_S3_PATH:   ${{ matrix.build_matrix.meta_s3_path }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads/meta"
          S3_URI="s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/artifacts/${META_S3_PATH}/${META_S3_KEY}"
          echo "📥 Downloading $S3_URI"
          aws s3 cp "$S3_URI" "$WORKSPACE/downloads/meta/"
          echo "✅ Download complete"
          ls -lh "$WORKSPACE/downloads/meta/"

      - name: Extract meta artifact and create qcomflash symlink
        shell: bash
        env:
          WORKSPACE:    ${{ github.workspace }}
          MACHINE:      ${{ matrix.build_matrix.machine }}
          META_S3_KEY:  ${{ matrix.build_matrix.meta_s3_key }}
        run: |
          set -euo pipefail

          TARBALL="$WORKSPACE/downloads/meta/${META_S3_KEY}"
          DEPLOY_DIR="$WORKSPACE/build/tmp/deploy/images/$MACHINE"
          mkdir -p "$DEPLOY_DIR"

          echo "📦 Extracting $TARBALL → $DEPLOY_DIR"
          tar -xf "$TARBALL" -C "$DEPLOY_DIR"

          echo "=== Extracted contents (depth 3) ==="
          find "$DEPLOY_DIR" -maxdepth 3 -print | sort

          # Search up to depth 2 for *.qcomflash directory (handles timestamped names)
          QCOMFLASH_DIR="$(
            find "$DEPLOY_DIR" -maxdepth 2 -type d -name "*.qcomflash" \
              | head -n 1 || true
          )"

          if [ -z "$QCOMFLASH_DIR" ]; then
            echo "⚠️  No *.qcomflash dir found, using top-level extracted subdir"
            QCOMFLASH_DIR="$(
              find "$DEPLOY_DIR" -maxdepth 1 -mindepth 1 -type d \
                | sort | head -n 1 || true
            )"
          fi

          if [ -z "$QCOMFLASH_DIR" ]; then
            echo "❌ Could not locate any extracted directory under $DEPLOY_DIR"
            exit 1
          fi

          echo "✅ Using qcomflash directory: $QCOMFLASH_DIR"

          SYMLINK_NAME="qcom-multimedia-proprietary-image-${MACHINE}.rootfs.qcomflash"
          ln -sfn "$QCOMFLASH_DIR" "$DEPLOY_DIR/$SYMLINK_NAME"
          echo "✅ Symlink: $DEPLOY_DIR/$SYMLINK_NAME → $QCOMFLASH_DIR"
          ls -la "$DEPLOY_DIR/"

      - name: Download iris_test_app from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/v4l-video-test-app/build"
          echo "Syncing files from s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/"
          aws s3 sync \
            "s3://qli-prd-video-gh-artifacts/qualcomm-linux/video-driver/iris_test_app/" \
            "$WORKSPACE/v4l-video-test-app/build/"
          echo "✅ Download complete"
          ls -la "$WORKSPACE/v4l-video-test-app/build/"

      - name: Download video-contents for testing
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/downloads"
          echo "Downloading video-content files"
          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"
          [ -f "$WORKSPACE/downloads/video_clips_iris.tar.gz" ] || {
            echo "❌ Failed to download video_clips_iris.tar.gz"
            exit 1
          }
          ls -la "$WORKSPACE/downloads/"

      - name: Inject Iris test app to rootfs
        uses: qualcomm-linux/video-driver/.github/actions/inject@meta-qcom_full-build-copy
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}

      - name: Prepare .qcomflash files for S3 upload
        shell: bash
        env:
          WORKSPACE:   ${{ github.workspace }}
          MACHINE:     ${{ matrix.build_matrix.machine }}
          META_S3_KEY: ${{ matrix.build_matrix.meta_s3_key }}
        run: |
          set -euo pipefail

          # ✅ Correct path — no /opt prefix
          symlink_path="$WORKSPACE/build/tmp/deploy/images/$MACHINE/qcom-multimedia-proprietary-image-${MACHINE}.rootfs.qcomflash"

          if [ ! -L "$symlink_path" ]; then
            echo "❌ Symlink not found: $symlink_path"
            exit 1
          fi

          resolved_dir=$(readlink -f "$symlink_path")

          if [ ! -d "$resolved_dir" ]; then
            echo "❌ Resolved .qcomflash directory not found: $resolved_dir"
            exit 1
          fi

          ROOTFS_IMG="$resolved_dir/rootfs.img"
          if [ ! -f "$ROOTFS_IMG" ]; then
            echo "❌ rootfs.img not found at: $ROOTFS_IMG"
            exit 1
          fi

          mkdir -p "$WORKSPACE/artifacts"
          : > "$WORKSPACE/artifacts/file_list.txt"

          # ---------------------------------------------------------------
          # Split into TWO artifacts:
          # 1. {machine}_flash_files.tar — everything EXCEPT rootfs.img (~600 MB)
          # 2. {machine}_rootfs.img      — injected rootfs (~6.4 GB)
          # LAVA downloads sequentially then combines inside Docker postprocess.
          # ---------------------------------------------------------------

          FLASH_TAR="$WORKSPACE/${MACHINE}_flash_files.tar"
          ROOTFS_DEST="$WORKSPACE/${MACHINE}_rootfs.img"

          echo "📦 Creating flash_files.tar (excluding rootfs.img)..."
          tar -cf "$FLASH_TAR" \
            -C "$resolved_dir" \
            --exclude='./rootfs.img' \
            .
          echo "✅ flash_files.tar: $(ls -lh "$FLASH_TAR" | awk '{print $5}')"

          echo "📦 Copying injected rootfs.img..."
          cp "$ROOTFS_IMG" "$ROOTFS_DEST"
          echo "✅ rootfs.img: $(ls -lh "$ROOTFS_DEST" | awk '{print $5}')"

          echo "$FLASH_TAR"   >> "$WORKSPACE/artifacts/file_list.txt"
          echo "$ROOTFS_DEST" >> "$WORKSPACE/artifacts/file_list.txt"

          echo "=== Queued for upload ==="
          cat "$WORKSPACE/artifacts/file_list.txt"

      - name: Upload artifacts to S3
        id: upload-artifacts
        uses: qualcomm-linux/video-driver/.github/actions/aws_s3_helper@meta-qcom_full-build-copy
        with:
          s3_bucket: qli-prd-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.build_matrix.machine }}

      - name: Upload machine-specific presigned URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}/presigned_urls.json
          retention-days: 3

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf "$WORKSPACE/artifacts"         || true
          rm -rf "$WORKSPACE/build"             || true
          rm -rf "$WORKSPACE/downloads"         || true
          rm -f  "$WORKSPACE/"*_flash_files.tar || true
          rm -f  "$WORKSPACE/"*_rootfs.img      || true

      - name: Update summary
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            summary=":heavy_check_mark: Build Success for ${{ matrix.build_matrix.machine }}"
          else
            summary=":x: Build Failed for ${{ matrix.build_matrix.machine }}"
          fi
          echo -e "<details><summary><i>Build Summary</i></summary>\n${summary}\n</details>" \
            >> "$GITHUB_STEP_SUMMARY"